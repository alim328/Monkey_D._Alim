<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#7bd9ed">
<title>Gökyüzü Kaşifi — Flappy Bird</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
:root{--ink:#283854;--cream:#fff8e8;--coral:#ff786c;--gold:#ffca59;--mint:#6dcba5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Nunito,'Trebuchet MS',sans-serif;color:var(--ink);background:#84d9e9}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;width:100%;position:relative;overflow:hidden;background:linear-gradient(#77d2e8 0%,#b8edf0 69%,#e3f2bd 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.shade{position:absolute;inset:0;display:grid;place-items:center;background:#27385145;padding:18px;transition:opacity .2s}.shade.hidden{opacity:0;pointer-events:none}.panel{width:min(440px,100%);max-height:min(90dvh,760px);overflow:auto;text-align:center;padding:27px 28px 24px;border:4px solid #fff;border-radius:30px;background:var(--cream);box-shadow:0 12px 0 #31425b2b,0 24px 55px #31425b30;position:relative;animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.93) translateY(8px);opacity:.4}to{transform:scale(1);opacity:1}}.logoSprite{width:76px;height:76px;object-fit:contain;image-rendering:pixelated;display:block;margin:0 auto 5px}.logo{font-size:clamp(32px,8vw,48px);line-height:1;margin:2px auto 9px;filter:drop-shadow(0 3px 0 #f1dca8)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#7690a7}.panel h1{font-size:clamp(23px,6vw,31px);margin:0 0 8px;font-weight:900}.subtitle{margin:0 auto 19px;line-height:1.5;color:#65748a;font-weight:700;font-size:14px;max-width:320px}.actions{display:grid;gap:10px}.btn{min-height:49px;padding:12px 18px;border-radius:16px;font-size:16px;font-weight:900;transition:transform .12s,filter .12s;box-shadow:0 4px 0 #00000019}.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #00000019}.primary{background:var(--coral);color:#fff}.secondary{background:#e7f4ed;color:#34765f}.tertiary{background:#ffedbd;color:#795b21}.small{min-height:40px;font-size:14px}.hint{font-size:12px;color:#8390a0;font-weight:800;margin:17px 0 0}.hud{position:absolute;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:max(15px,env(safe-area-inset-top)) 16px 0;pointer-events:none}.hud button,.score{pointer-events:auto}.pause{width:48px;height:48px;border-radius:16px;background:#fff9e9;color:#30415b;font-size:21px;font-weight:900;box-shadow:0 4px 0 #34415730}.score{font-size:29px;font-weight:900;color:#fff;text-shadow:0 3px 0 #38516d80;min-width:44px;text-align:center}.hud.hidden{display:none}.panel .back{position:absolute;left:15px;top:14px;border-radius:12px;background:#eaf2e8;padding:8px 11px;font-size:13px;font-weight:900}.panel.sub{padding-top:50px}.costumes{display:flex;justify-content:center;gap:12px;margin:17px 0 20px}.costume{background:#e7f4ed;border:3px solid transparent;border-radius:19px;width:83px;height:92px;display:grid;place-items:center;gap:2px;font-size:36px}.costume img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}.costume span{font-size:11px;font-weight:900}.costume.selected{border-color:var(--coral);background:#fff0e8}.how{margin:14px 0 20px;text-align:left;line-height:1.65;color:#586a7e;font-size:14px;font-weight:700}.how strong{color:var(--ink)}.toast{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:#fff8e8eF;font-weight:900;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}@media(max-height:560px){.panel{padding:17px 22px 16px}.logo{font-size:31px}.subtitle{margin-bottom:12px}.actions{gap:7px}.btn{min-height:42px}.hint{margin-top:10px}.panel.sub{padding-top:47px}}
</style>
</head>
<body><main class="app" id="app"><canvas id="game" aria-label="Flappy Bird oyunu"></canvas>
<div class="hud hidden" id="hud"><button class="pause" id="pause" aria-label="Menüye dön">Ⅱ</button><div class="score" id="score">0</div><div style="width:48px"></div></div>
<div class="shade" id="shade"><section class="panel" id="panel"></section></div><div class="toast" id="toast">Kanat çırpmak için dokun veya boşluk tuşuna bas!</div></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),shade=document.querySelector('#shade'),panel=document.querySelector('#panel'),hud=document.querySelector('#hud'),scoreEl=document.querySelector('#score'),toast=document.querySelector('#toast');
const birds=[{emoji:'🐤',name:'Süper Saç',src:'img/1.png'},{emoji:'📓',name:'Gizemli',src:'img/2.png'},{emoji:'👒',name:'Hasır Şapka',src:'img/3.png'},{emoji:'⚔️',name:'Samuray',src:'img/4.png'},{emoji:'🔴',name:'Kızıl',src:'img/5.png'}];const sprites=birds.map(b=>{const image=new Image();image.src=b.src;return image});let birdIndex=0,W=0,H=0,dpr=1,state='menu',paused=false,score=0,bird={x:0,y:0,vy:0,r:18},pipes=[],last=0,raf=0,world=0,toastTimer=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(state!=='playing')draw()}addEventListener('resize',resize);
function menu(){state='menu';hud.classList.add('hidden');shade.classList.remove('hidden');panel.className='panel';panel.innerHTML=`<img class="logoSprite" src="${birds[birdIndex].src}" alt="${birds[birdIndex].name}"><div class="eyebrow">Gökyüzü Kaşifi</div><h1>Uçmaya hazır mısın?</h1><p class="subtitle">Bulutların arasından süzül, engellere çarpmadan en yüksek skora ulaş!</p><div class="actions"><button class="btn primary" id="start">▶ Oyunu başlat</button>${paused?'<button class="btn secondary" id="resume">↗ Devam et</button>':''}<button class="btn tertiary" id="costumes">✦ Kostümler</button><button class="btn secondary" id="about">♡ Hakkında</button></div><p class="hint">Masaüstünde ESC · Telefonda sol üstteki Ⅱ</p>`;document.querySelector('#start').onclick=start;document.querySelector('#resume')?.addEventListener('click',paused?continueGame:start);document.querySelector('#costumes').onclick=showCostumes;document.querySelector('#about').onclick=showAbout;draw()}
function subPanel(title,body){panel.className='panel sub';panel.innerHTML=`<button class="back" id="back">← Menü</button><div class="logo">${title==='Kostümler'?'✨':'☁️'}</div><h1>${title}</h1>${body}`;document.querySelector('#back').onclick=menu}
function showCostumes(){subPanel('Kostümler',`<p class="subtitle">Gökyüzüne hangi arkadaşınla çıkacaksın?</p><div class="costumes">${birds.map((b,i)=>`<button class="costume ${i===birdIndex?'selected':''}" data-i="${i}"><img src="${b.src}" alt=""><span>${b.name}</span></button>`).join('')}</div><button class="btn primary small" id="done">Tamam</button>`);panel.querySelectorAll('.costume').forEach(b=>b.onclick=()=>{birdIndex=+b.dataset.i;showCostumes()});document.querySelector('#done').onclick=menu}
function showAbout(){subPanel('Hakkında',`<div class="how"><strong>Nasıl oynanır?</strong><br>• Kuşu havalandırmak için ekrana dokun veya <strong>boşluk</strong> tuşuna bas.<br>• Boruların arasından geçerek puan kazan.<br>• Bir engele çarparsan oyun biter. <strong>ESC</strong> ile menüye dönebilir, telefonda sol üstteki durdur düğmesini kullanabilirsin.<br><br><strong>Geliştirici:</strong> Onur Arda Özcan</div><button class="btn primary small" id="done">Anladım</button>`);document.querySelector('#done').onclick=menu}
function start(){paused=false;score=0;scoreEl.textContent='0';pipes=[];bird={x:Math.min(W*.27,130),y:H*.42,vy:0,r:18};world=0;state='playing';shade.classList.add('hidden');hud.classList.remove('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function continueGame(){paused=false;state='playing';shade.classList.add('hidden');hud.classList.remove('hidden');last=performance.now();raf=requestAnimationFrame(loop)}
function pause(){if(state!=='playing')return;paused=true;menu()}
function flap(){if(state==='playing'){bird.vy=-H*.48;bird.vy=Math.max(bird.vy,-410)}}
function input(e){if(e.type==='keydown'&&(e.code==='Space'||e.code==='ArrowUp')){e.preventDefault();flap()}else if(e.type==='pointerdown'&&!e.target.closest('button')&&state==='playing')flap()}
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();state==='playing'?pause():state==='menu'?null:menu()}else input(e)});canvas.addEventListener('pointerdown',input);document.querySelector('#pause').onclick=pause;
function loop(t){if(state!=='playing')return;const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();if(state==='playing')raf=requestAnimationFrame(loop)}
function update(dt){world+=dt;bird.vy+=1050*dt;bird.y+=bird.vy*dt;let gap=Math.max(142,Math.min(205,H*.29)),pw=66,speed=Math.min(255,W*.48);if(!pipes.length||pipes[pipes.length-1].x<W- Math.max(205,W*.54)){const margin=Math.max(90,H*.16);pipes.push({x:W+10,top:margin+Math.random()*Math.max(1,H-gap-2*margin),gap,passed:false})}for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+pw<bird.x){p.passed=true;score++;scoreEl.textContent=score}if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+pw&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap))endGame()}pipes=pipes.filter(p=>p.x>-pw-10);if(bird.y+bird.r>H-65||bird.y-bird.r<0)endGame()}
function endGame(){if(state!=='playing')return;state='over';setTimeout(()=>{if(state!=='over')return;hud.classList.add('hidden');shade.classList.remove('hidden');panel.className='panel';panel.innerHTML=`<div class="logo">${score>=5?'🏆':'💫'}</div><div class="eyebrow">Uçuş tamamlandı</div><h1>${score>=5?'Harika uçuş!':'Bir kez daha?'}</h1><p class="subtitle">Skorun <strong>${score}</strong> — biraz daha yükseğe uçabilirsin!</p><div class="actions"><button class="btn primary" id="again">↻ Yeniden oyna</button><button class="btn secondary" id="home">⌂ Ana menü</button></div>`;document.querySelector('#again').onclick=start;document.querySelector('#home').onclick=menu},350)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#75d1e7');sky.addColorStop(.7,'#c5edf0');sky.addColorStop(1,'#eaf1c4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// sun and drifting clouds
ctx.fillStyle='#ffe69b';ctx.beginPath();ctx.arc(W*.8,H*.16,Math.min(39,W*.09),0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){let x=((i*197-world*13)%(W+180)+W+180)%(W+180)-90,y=H*(.18+(i%3)*.12);ctx.fillStyle='#ffffff9c';ctx.beginPath();ctx.ellipse(x,y,33,13,0,0,7);ctx.ellipse(x+17,y-7,23,17,0,0,7);ctx.ellipse(x+38,y,29,12,0,0,7);ctx.fill()}
// soft hills
ctx.fillStyle='#a7dcad';ctx.beginPath();ctx.moveTo(0,H-82);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H-96-Math.sin(x*.012+world*.22)*14-Math.sin(x*.005)*16);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#85ca9b';ctx.beginPath();ctx.moveTo(0,H-55);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H-72-Math.sin(x*.009-world*.3)*11);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#f4df9c';ctx.fillRect(0,H-48,W,48);ctx.fillStyle='#fff0bb';ctx.fillRect(0,H-48,W,6);
// pipes
pipes.forEach(p=>{let pw=66;pipe(p.x,0,pw,p.top,true);pipe(p.x,p.top+p.gap,pw,H-(p.top+p.gap)-48,false)});
// decorative grass
ctx.strokeStyle='#70b979';ctx.lineWidth=3;for(let x=10;x<W;x+=31){let sway=Math.sin(world*3+x)*3;ctx.beginPath();ctx.moveTo(x,H-7);ctx.quadraticCurveTo(x-5+sway,H-23,x-3+sway,H-29);ctx.moveTo(x,H-7);ctx.quadraticCurveTo(x+8+sway,H-19,x+9+sway,H-25);ctx.stroke()}
// bird
let bx=bird.x||Math.min(W*.27,130),by=bird.y||H*.42;ctx.save();ctx.translate(bx,by);ctx.rotate(Math.max(-.38,Math.min(.75,(bird.vy||0)/560)));ctx.fillStyle='#df9b45';ctx.beginPath();ctx.ellipse(0,2,20,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd45f';ctx.beginPath();ctx.ellipse(-3,5,13,10,0,0,Math.PI*2);ctx.fill();const sprite=sprites[birdIndex];if(sprite&&sprite.complete&&sprite.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(sprite,-34,-34,68,68)}else{ctx.font='29px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(birds[birdIndex].emoji,0,-1)}ctx.restore()}
function pipe(x,y,w,h,top){if(h<1)return;ctx.fillStyle='#63bf83';rr(x+5,y,w-10,h,10);ctx.fillStyle='#86d999';rr(x+10,y+3,w-28,h-6,7);ctx.fillStyle='#4da86e';if(top)rr(x-4,y+h-25,w+8,25,8);else rr(x-4,y,w+8,25,8);ctx.fillStyle='#a5e8aa';rr(x+4,top?y+h-23:y+2,8,top?18:18,4)}
function showToast(){toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
resize();menu();
})();
</script></body></html>
